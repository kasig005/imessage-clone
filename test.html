<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Layout Test</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Layout Test">
<style>
:root{
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --app-extend: 0px;   /* set by JS: the unreachable strip below the viewport */
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#fff;}

/* Same container strategy as the real app */
#app{position:fixed; top:0; left:0; right:0; bottom:0;
     height:calc(100% + var(--app-extend));
     display:flex; flex-direction:column; overflow:hidden;
     background:#000; border:2px solid #00e5ff;}

.head{padding-top:var(--safe-top); padding-left:14px; padding-right:14px; flex-shrink:0;}
h1{font-size:19px; margin:10px 0 4px;}
.note{font-size:12.5px; color:#8e8e93; line-height:1.45; margin-bottom:8px;}

.readout{flex:1; min-height:0; overflow-y:auto; padding:0 14px 10px; font-size:13.5px;}
.row{display:flex; justify-content:space-between; gap:10px;
     padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.12);}
.k{color:#8e8e93;}
.v{font-variant-numeric:tabular-nums; font-weight:600;}
.v.good{color:#31d454;}
.v.bad{color:#ff453a;}

#verdict{margin:10px 0 0; padding:12px; border-radius:10px;
  background:#1c1c1e; font-size:14px; line-height:1.5;}
#verdict b{color:#0a84ff;}
.big{font-size:26px; font-weight:800; color:#31d454; display:block; margin:6px 0;}

/* THE BAR UNDER TEST — magenta so you can see exactly where it ends */
.testbar{
  flex-shrink:0; background:#ff2d95;
  padding:10px; padding-bottom:calc(10px + var(--safe-bottom));
  text-align:center; font-weight:700; font-size:13px;
}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>Layout Diagnostic</h1>
    <div class="note">
      The <span style="color:#ff2d95;font-weight:700;">pink bar</span> below mimics your
      message bar. The <span style="color:#00e5ff;font-weight:700;">blue outline</span> is the
      app container. Look at the very bottom of your screen, then read the verdict.
    </div>
  </div>

  <div class="readout" id="readout"></div>

  <div class="testbar">PINK BAR &mdash; does this reach the bottom?</div>
</div>

<script>
function px(n){ return Math.round(n * 10) / 10 + "px"; }

/* THE FIX: iOS standalone reports a viewport shorter than the real screen.
   Stretch #app into that unreachable strip. Standalone only — in Safari the
   same difference is the browser toolbars and must not be overlapped. */
function setAppExtend(){
  const standalone = (window.navigator.standalone === true) ||
                     window.matchMedia('(display-mode: standalone)').matches;
  let extend = 0;
  if(standalone){
    const diff = (window.screen.height || 0) - window.innerHeight;
    if(diff > 0 && diff < 200) extend = diff;
  }
  document.documentElement.style.setProperty('--app-extend', extend + 'px');
  return extend;
}

function measure(){
  const applied = setAppExtend();
  const app  = document.getElementById('app');
  const bar  = document.querySelector('.testbar');
  const appR = app.getBoundingClientRect();
  const barR = bar.getBoundingClientRect();

  // Read the real safe-area inset this device reports
  const probe = document.createElement('div');
  probe.style.cssText =
    'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0;';
  document.body.appendChild(probe);
  const inset = probe.getBoundingClientRect().height;
  probe.remove();

  const vh        = window.innerHeight;
  const vvH       = window.visualViewport ? window.visualViewport.height : vh;
  const screenH   = window.screen.height;
  const dpr       = window.devicePixelRatio || 1;
  const standalone= (window.navigator.standalone === true) ||
                    window.matchMedia('(display-mode: standalone)').matches;

  const appGap = vh - appR.bottom;      // container short of viewport?
  const barGap = appR.bottom - barR.bottom; // bar short of container?

  const bottomReach = barR.bottom;
  const rows = [
    ["Opened from Home Screen?", standalone ? "YES (standalone)" : "NO (in Safari)", null],
    ["window.innerHeight",  px(vh), null],
    ["visualViewport.height", px(vvH), null],
    ["screen.height",       px(screenH), null],
    ["devicePixelRatio",    dpr, null],
    ["safe-area-inset-bottom", px(inset), null],
    ["Dead zone (screen \u2212 viewport)", px(screenH - vh), null],
    ["FIX APPLIED (--app-extend)", px(applied), applied > 0 ? "good" : null],
    ["App container bottom", px(appR.bottom), null],
    ["Pink bar bottom",      px(barR.bottom), null],
    ["GAP: viewport \u2212 container", px(appGap), appGap <= 1 ? "good" : "bad"],
    ["GAP: container \u2212 bar",      px(barGap), barGap <= 1 ? "good" : "bad"],
  ];

  document.getElementById('readout').innerHTML =
    rows.map(([k,v,cls]) =>
      `<div class="row"><span class="k">${k}</span>
       <span class="v ${cls||''}">${v}</span></div>`).join('')
    + buildVerdict(appGap, barGap, inset, standalone, applied, bottomReach, screenH);
}

function buildVerdict(appGap, barGap, inset, standalone, applied, bottomReach, screenH){
  let html = '<div id="verdict">';

  if(!standalone){
    html += "<b>Open this from your Home Screen.</b><br>" +
            "In Safari the toolbar covers the bottom, so this test can't see the " +
            "real problem. Add to Home Screen, then reopen from that icon.";
    html += '</div>';
    return html;
  }

  const shortfall = Math.round(screenH - bottomReach);

  if(applied > 0){
    html += "<b>Dead zone detected and patched.</b><br>" +
            "iOS gave this page a viewport " + px(applied) + " shorter than your " +
            "screen. The app has been stretched into it.";
    if(shortfall <= 2){
      html += "<span class='big'>\u2713 FIXED</span>" +
              "The pink bar now reaches the bottom of your screen. " +
              "This same fix is already in index.html.";
    } else {
      html += "<span class='big' style='color:#ff453a'>" + shortfall + "px still short</span>" +
              "Mostly closed, but a strip remains. Add this to index.html:<br>" +
              "<b>--bar-drop: " + shortfall + "px</b>";
    }
  } else if(shortfall <= 2){
    html += "<b>No gap.</b> The pink bar already reaches the bottom on this device.";
  } else {
    html += "<b>Gap of " + shortfall + "px, but no dead zone detected.</b><br>" +
            "The viewport matches the screen, so this is padding. Set " +
            "<b>--input-bar-gap: 0px</b> and <b>--safe-bottom-scale: 0</b> " +
            "(device reports a " + px(inset) + " inset).";
  }

  html += '</div>';
  return html;
}

measure();
window.addEventListener('resize', measure);
window.addEventListener('orientationchange', ()=>setTimeout(measure,300));
if(window.visualViewport) window.visualViewport.addEventListener('resize', measure);
</script>
</body>
</html>
